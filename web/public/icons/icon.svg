<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2e"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#7d7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7d7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset="1" stop-color="#b88a35"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe0c8"/>
      <stop offset="1" stop-color="#1489a0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a8cff"/>
      <stop offset="1" stop-color="#a36bff"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30364f"/>
      <stop offset="1" stop-color="#151824"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g id="art">
    <!-- three cards peeking out of a pocket -->
    <rect x="110" y="92" width="292" height="184" rx="24" fill="url(#gold)"/>
    <rect x="110" y="92" width="292" height="40" rx="20" fill="url(#shine)" opacity="0.6"/>
    <rect x="102" y="140" width="308" height="190" rx="25" fill="url(#teal)"/>
    <rect x="102" y="140" width="308" height="40" rx="20" fill="url(#shine)" opacity="0.5"/>
    <rect x="94" y="190" width="324" height="196" rx="26" fill="url(#violet)"/>
    <rect x="94" y="190" width="324" height="44" rx="22" fill="url(#shine)" opacity="0.55"/>
    <rect x="126" y="214" width="50" height="38" rx="9" fill="#f6dc96"/>
    <path d="M140 214v38M162 214v38M126 233h50" stroke="#c9a14b" stroke-width="3" opacity="0.7"/>
    <path d="M198 222a14 14 0 0 1 0 22M210 215a26 26 0 0 1 0 36" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- pocket, with a stitched lip -->
    <path d="M80 262Q256 330 432 262V398a40 40 0 0 1-40 40H120a40 40 0 0 1-40-40Z" fill="url(#pocket)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
    <path d="M80 262Q256 330 432 262" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" fill="none"/>
    <path d="M104 286Q256 346 408 286" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round" fill="none"/>
    <circle cx="256" cy="380" r="16" fill="url(#violet)"/>
    <circle cx="256" cy="380" r="6" fill="#151824"/>
  </g>
</svg>
