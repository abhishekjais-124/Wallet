# Render blueprint for Wallet. Served at https://aj124.com/Wallet (a Cloudflare Worker forwards /Wallet* here, path unchanged).
# The service only ships static files: cards are encrypted and stored in the browser, so no secrets or disk are needed.
services:
  - type: web
    name: wallet
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && WALLET_BASE=/Wallet npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WALLET_BASE
        value: /Wallet
      # OAuth web client id for "Sign in with Google" sync (public, not a secret): project wallet-513414,
      # owner abhishekjaiswal124@gmail.com, client "Wallet web"; empty hides sync
      - key: WALLET_GOOGLE_CLIENT_ID
        value: 465085654408-q9o4hvn2t0jlcko7el83kva3bccp6ijg.apps.googleusercontent.com
